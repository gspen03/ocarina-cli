services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ocarina_cli
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 3s
      timeout: 3s
      retries: 15

  app:
    image: gspen03/ocarina-cli:latest
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true
    environment:
      DB_URL: jdbc:mysql://db:3306/ocarina_cli
      DB_USER: root
      DB_PASS: rootpassword
